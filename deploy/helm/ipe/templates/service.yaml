apiVersion: v1
kind: Service
metadata:
  name: {{ include "ipe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ipe.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.dataPort }}
      targetPort: data
      protocol: TCP
      name: data
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "ipe.selectorLabels" . | nindent 4 }}
