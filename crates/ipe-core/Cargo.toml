[package]
name = "ipe-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
parking_lot = { workspace = true }

chrono = { workspace = true }
tracing = { workspace = true }

# Approval storage (optional feature)
rocksdb = { workspace = true, optional = true }
sha2 = { version = "0.10.9", optional = true }
tempfile = { version = "3.8", optional = true }

[features]
default = []
approvals = ["rocksdb", "tempfile", "sha2"]

[dev-dependencies]
criterion = "0.5"
# Fix minimal versions - criterion depends on regex, ensure we use >= 1.5.5 to avoid syntax module issues
regex = ">=1.5.5"

[[bench]]
name = "approval_benchmarks"
harness = false
required-features = ["approvals"]

[[bench]]
name = "relationship_benchmarks"
harness = false
required-features = ["approvals"]

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["approvals"]

[[example]]
name = "policy_scenarios"
required-features = ["approvals"]
