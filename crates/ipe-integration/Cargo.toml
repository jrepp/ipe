[package]
name = "ipe-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ipe-integration"
description = "Bounded native integration discovery workload"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
subtle = "2.6"
hmac = "0.12"
sha2 = "0.10"
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "portable-dispatch"] }

[build-dependencies]
wat = "1"

[dev-dependencies]
wat = "1"
tempfile = "3"
