[package]
name = "ipe-integration"
version.workspace = true
edition.workspace = true
rust-version = "1.96"
license.workspace = true
default-run = "ipe-integration"
description = "Bounded native integration discovery workload"

[dependencies]
ipe-json = { path = "../ipe-json" }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage"] }
secrecy = "0.10.3"
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
subtle = "2.6"
hmac = "0.12"
sha2 = "0.10"
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "portable-dispatch"] }
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }
oxc_allocator = "0.152.0"
oxc_codegen = "0.152.0"
oxc_parser = "0.152.0"
oxc_semantic = "0.152.0"
oxc_span = "0.152.0"
oxc_transformer = "0.152.0"
# Oxc imports identifier helpers added after 1.0.0; keep minimal-versions checks buildable.
unicode-id-start = ">=1.5.0"

rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }

[build-dependencies]
wat = "1"

[dev-dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["client"] }
wat = "1"
tempfile = "3"
