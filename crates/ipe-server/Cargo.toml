[package]
name = "ipe-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "IPE Policy Engine HTTP Server"

[[bin]]
name = "ipe-server"
path = "src/main.rs"

[dependencies]
ipe-json = { path = "../ipe-json" }
secrecy = "0.10.3"
tokio-util = { version = "0.7.19", features = ["rt"] }
ipe-core = { path = "../ipe-core", features = ["approvals"] }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
subtle = "2.6"
# Version floor: rustix 0.38.0 (the -Zminimal-versions pick via the
# reqwest chain) does not compile on current nightly (reserved
# rustc_layout_scalar_valid_range_start/end attributes). See
# .github/scripts/check-minimal-versions.sh.
rustix = ">=0.38.34"
