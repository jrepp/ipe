name: Workflow validation

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install configuration validators
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.25.1
      - name: Validate GitHub Actions syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate Mergify against its published schema
        run: python .github/scripts/check-mergify.py
      - name: Test queue gates and required workflow triggers
        run: python -m unittest discover -s .github/scripts/tests -p 'test_merge_queue.py' -v
      - name: Check repository organization and artifact validation
        run: |
          python scripts/check-repository.py
          python -m unittest discover -s scripts/repository-tests -v
