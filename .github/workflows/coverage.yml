name: Code Coverage

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Generate Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-coverage-workspace-${{ hashFiles('**/Cargo.toml', '.cargo/config', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-coverage-workspace-${{ hashFiles('**/Cargo.toml', '.cargo/config', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-

      - name: Cache cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-cargo-llvm-cov-0.9.1

      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Generate HTML report
        run: cargo llvm-cov --all-features --workspace --no-run --html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: ./.github/scripts/check-coverage.sh --reuse-coverage

  coverage-per-crate:
    name: Per-Crate Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [ipe-core]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-coverage-${{ matrix.crate }}-${{ hashFiles('**/Cargo.toml', '.cargo/config', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-coverage-${{ matrix.crate }}-${{ hashFiles('**/Cargo.toml', '.cargo/config', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-

      - name: Cache cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-cargo-llvm-cov-0.9.1

      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Generate coverage for ${{ matrix.crate }}
        run: |
          cd crates/${{ matrix.crate }}
          cargo llvm-cov --all-features

      - name: Check critical path coverage
        run: |
          cd crates/${{ matrix.crate }}
          # Generate detailed coverage report
          cargo llvm-cov --all-features --no-run --text > coverage.txt

          # Check that critical files have 100% coverage
          critical_files=(
            "src/interpreter/vm.rs"
            "src/engine/policy_db.rs"
            "src/rar/context.rs"
          )

          for file in "${critical_files[@]}"; do
            if [ -f "$file" ]; then
              coverage=$(grep "$file" coverage.txt | grep -oP '\d+\.\d+%' | head -1 || echo "0.0%")
              echo "$file: $coverage"

              # Require 100% coverage for critical paths
              if [[ ! "$coverage" =~ ^100\.0% ]]; then
                echo "❌ Critical file $file has insufficient coverage: $coverage"
                exit 1
              fi
            fi
          done

          echo "✅ All critical paths have 100% coverage"
