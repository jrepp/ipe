name: Performance Benchmarks

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    # Run benchmarks daily at 02:00 UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-bench-all-features-${{ hashFiles('**/Cargo.toml', '.cargo/config', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-bench-all-features-${{ hashFiles('**/Cargo.toml', '.cargo/config', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-

      - name: Run benchmarks
        shell: bash
        run: cargo bench --all-features 2>&1 | tee benchmark-results.txt

      - name: Summarize benchmark results
        run: echo 'Benchmark results are available in the benchmark-results artifact. No performance thresholds are enforced.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt

      # Removed: benchmark-action can't parse colored Criterion output
      # TODO: Create wrapper script to extract clean benchmark data
      # - name: Store benchmark result
      #   uses: benchmark-action/github-action-benchmark@v1
      #   with:
      #     tool: 'cargo'
      #     output-file-path: benchmark-results.txt
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     auto-push: true
      #     alert-threshold: '110%'
      #     comment-on-alert: true
      #     fail-on-alert: true

  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build debug
        run: cargo build --all-features

      - name: Run valgrind
        run: |
          # Run tests under valgrind
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes \
            --error-exitcode=1 \
            cargo test --all-features 2>&1 | tee valgrind-output.txt

      - name: Upload valgrind report
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-report
          path: valgrind-output.txt

      - name: Check for memory leaks
        run: |
          if grep -q "definitely lost" valgrind-output.txt; then
            echo "❌ Memory leaks detected"
            grep "definitely lost" valgrind-output.txt
            exit 1
          else
            echo "✅ No memory leaks detected"
          fi
