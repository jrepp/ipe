name: Release notes

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/release.yml'
      - 'scripts/draft-release.sh'
      - 'scripts/tests/test_draft_release.py'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to draft
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-notes-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -p 'test_draft_release.py' -v

  draft:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate a draft release from merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/draft-release.sh "$RELEASE_TAG"
