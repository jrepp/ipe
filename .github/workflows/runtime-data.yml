name: Runtime data acceptance

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and TLS fixture dependencies
        run: |
          missing=()
          for package in libclang-dev cmake openssl; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Test runtime storage and language
        run: cargo test --locked -p ipe-core --features approvals
      - name: Test server boundaries
        run: cargo test --locked -p ipe-server
      - name: Build server
        run: cargo build --locked -p ipe-server
      - name: Exercise public API and HTTPS pull connector
        run: python3 scripts/accept-runtime-data.py
      - name: Exercise policy documents and external imports
        run: make policy-acceptance
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-data-acceptance
          path: |
            target/runtime-data-acceptance.json
            target/policy-data-acceptance.json
            target/policy-data-scenarios.json
          if-no-files-found: warn
