name: Docs site

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-site:
    name: Build and check docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build parser output, measurements, and portable site
        run: make docs-site DOCS_PYTHON=python
      - name: Install locked test dependencies
        run: npm ci --prefix docs --ignore-scripts
      - name: Validate generated data and artifact links
        run: python -m unittest discover -s scripts/tests -v
      - name: Check page interactions and error states
        run: npm test --prefix docs
      - name: Check exporter formatting
        run: rustfmt --check --edition 2021 crates/ipe-core/examples/docs_data.rs
      - name: Save reviewable site and measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-${{ github.sha }}
          path: target/docs-site/
          if-no-files-found: error
          retention-days: 14
      # Validate the exact Pages archive on PRs too, without granting deployment permissions.
      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/docs-site/

  publish:
    name: Publish docs to GitHub Pages
    needs: docs-site
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
