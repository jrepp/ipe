name: Docs site

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-site:
    name: Build and check docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build parser output, measurements, and portable site
        run: make docs-site DOCS_PYTHON=python
      - name: Install locked test dependencies
        run: npm ci --prefix docs --ignore-scripts
      - name: Validate generated data and artifact links
        run: python -m unittest discover -s scripts/tests -v
      - name: Check page interactions and error states
        run: npm test --prefix docs
      - name: Check exporter formatting
        run: rustfmt --check --edition 2021 crates/ipe-core/examples/docs_data.rs
      - name: Save reviewable site and measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-${{ github.sha }}
          path: target/docs-site/
          if-no-files-found: error
          retention-days: 14
