name: Nightly platform release builds

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ipe-macos-x86_64
            executable: ipe-server
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ipe-macos-aarch64
            executable: ipe-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ipe-windows-x86_64
            executable: ipe-server.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Build locked workspace release
        run: cargo build --locked --workspace --release --target ${{ matrix.target }} --all-features
      - name: Check server release artifact
        run: python scripts/check-release-artifact.py ${{ matrix.target }}
      - name: Retain server binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14
