name: Security Audit

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    # Run security audit daily at 00:00 UTC
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-cargo-audit-0.22.0

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Check dependency lockfile
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Run cargo audit (JSON output)
        if: ${{ !cancelled() }}
        run: cargo audit --json > audit-report.json
        continue-on-error: true

      - name: Upload audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: audit-report.json

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-cargo-deny-0.18.8

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.18.8 --locked

      - name: Run cargo deny
        run: cargo deny --locked --all-features check

  miri:
    name: Miri (Undefined Behavior Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup miri
        run: cargo miri setup

      - name: Run miri tests
        # Scope to ipe-core and disable the approvals feature: workspace-wide
        # runs unify features and ipe-server enables ipe-core/approvals, which
        # pulls RocksDB FFI tests into Miri (Miri cannot execute C code).
        # The jit,testing features (and the legacy engine they exercised) were
        # deleted with the legacy engine cluster, so Miri now covers the
        # default-feature unit tests (rar) only.
        run: cargo miri test -p ipe-core --no-default-features
        env:
          # -Zmiri-disable-isolation: tests may call chrono::Utc::now()
          # (SystemTime::now), which Miri's sandbox rejects as an unsupported
          # foreign call. That is a sandbox limitation, not undefined behavior;
          # strict-provenance and symbolic-alignment-check (the actual UB
          # detectors) remain enabled.
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-disable-isolation"
        # Note: Excluding 'approvals' feature because RocksDB uses FFI which Miri cannot test

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Instrumented native dependencies (including RocksDB) need a full rebuild.
    timeout-minutes: 20
    strategy:
      # Retain each independent sanitizer result when another platform fails.
      fail-fast: false
      matrix:
        include:
          - { sanitizer: address, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { sanitizer: leak, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { sanitizer: thread, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { sanitizer: thread, os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Test sanitizer failure handling
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_check_sanitizer.py' -v

      - name: Run tests with ${{ matrix.sanitizer }} sanitizer
        run: ./.github/scripts/check-sanitizer.sh ${{ matrix.sanitizer }} ${{ matrix.target }}

      - name: Preserve sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-${{ matrix.sanitizer }}-${{ matrix.target }}-reports
          path: target/sanitizer-reports/
          if-no-files-found: warn
          retention-days: 14

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      # Keep cargo install for this unpinned tool so updates are picked up.
      - name: Cache cargo-geiger
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-geiger
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-cargo-geiger-${{ github.sha }}
          restore-keys: |
            v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-cargo-geiger-

      - name: Install cargo-geiger
        run: cargo install cargo-geiger

      - name: Run cargo-geiger (unsafe code detection)
        run: ./.github/scripts/check-supply-chain.sh

      # Note: Removed redundant ipe-core check - the wrapper script above
      # already validates all workspace crates including ipe-core
