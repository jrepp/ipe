name: Security Audit

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    # Run security audit daily at 00:00 UTC
    - cron: '0 0 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Check dependency lockfile
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Run cargo audit (JSON output)
        if: ${{ !cancelled() }}
        run: cargo audit --json > audit-report.json
        continue-on-error: true

      - name: Upload audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.18.8 --locked

      - name: Run cargo deny
        run: cargo deny --locked --all-features check

  miri:
    name: Miri (Undefined Behavior Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup miri
        run: cargo miri setup

      - name: Run miri tests
        # Scope to ipe-core and disable the approvals feature: workspace-wide
        # runs unify features and ipe-server enables ipe-core/approvals, which
        # pulls RocksDB FFI tests into Miri (Miri cannot execute C code).
        run: cargo miri test -p ipe-core --no-default-features --features jit,testing
        env:
          # -Zmiri-disable-isolation: approval/tiering tests call chrono::Utc::now()
          # (SystemTime::now), which Miri's sandbox rejects as an unsupported
          # foreign call. That is a sandbox limitation, not undefined behavior;
          # strict-provenance and symbolic-alignment-check (the actual UB
          # detectors) remain enabled.
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-disable-isolation"
        # Note: Excluding 'approvals' feature because RocksDB uses FFI which Miri cannot test

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        sanitizer: [address, leak, thread]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests with ${{ matrix.sanitizer }} sanitizer
        run: ./.github/scripts/check-sanitizer.sh ${{ matrix.sanitizer }}

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-geiger
        run: cargo install cargo-geiger

      - name: Run cargo-geiger (unsafe code detection)
        run: ./.github/scripts/check-supply-chain.sh

      # Note: Removed redundant ipe-core check - the wrapper script above
      # already validates all workspace crates including ipe-core
