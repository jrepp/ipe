name: Integration workload
on:
  pull_request:
    paths:
      - 'crates/ipe-integration/**'
      - 'crates/ipe-json/**'
      - 'acceptance/integration-discovery/**'
      - 'testing/integration/**'
      - 'tools/integration-packages/**'
      - 'tools/github-contract/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/integration.yml'
  push:
    branches: [main]
    paths:
      - 'crates/ipe-integration/**'
      - 'crates/ipe-json/**'
      - 'acceptance/integration-discovery/**'
      - 'testing/integration/**'
      - 'tools/integration-packages/**'
      - 'tools/github-contract/**'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/integration.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: testing/integration/package-lock.json
      - run: npm ci --prefix testing/integration
      - run: npm run check --prefix testing/integration
      - run: npm test --prefix testing/integration
      - run: npm ci --ignore-scripts --prefix tools/integration-packages
      - run: npm test --prefix tools/integration-packages
      - run: npm ci --ignore-scripts --prefix docs
      - run: node --test tools/github-contract/view.test.cjs
      - run: testing/integration/node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node testing/integration/adapters/read-step.ts --typeRoots testing/integration/node_modules/@types
      - run: cargo clippy --locked -p ipe-json -p ipe-integration --all-targets -- -D warnings
      - run: cargo test --locked -p ipe-json -p ipe-integration --all-targets
      - run: cargo test --locked -p ipe-integration --test discovery_acceptance -- --ignored
      - run: cargo build --locked -p ipe-integration --bins
      - run: cargo run --locked -p ipe-integration --example integration-demo -- --report target/integration-demo-report.json
      - name: Replay independent external client against deployed binaries
        run: cargo run --locked -p ipe-integration --example integration-demo -- --external-agent --report target/external-agent-validation.json
      - name: Preserve sanitized deployment reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-deployment-reports
          path: |
            target/integration-demo-report.json
            target/external-agent-validation.json
          if-no-files-found: warn
          retention-days: 14
