<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">IPE policy publication and enforcement</title><desc id="desc">Target architecture: separate publication rights, shared policy catalog, local decisions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#71879a"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="1040" fill="white"/>
<text x="42" y="51" fill="#17324d" font-size="32" font-weight="700" text-anchor="start"><tspan x="42" dy="0">IPE policy publication and enforcement</tspan></text>
<text x="42" y="86" fill="#526b80" font-size="19" font-weight="400" text-anchor="start"><tspan x="42" dy="0">Target architecture: separate publication rights, shared policy catalog, local decisions.</tspan></text>
<path d="M 42 110 H 1398" fill="none" stroke="#d6e1e9" stroke-width="2.4"/>
<rect x="410" y="145" width="590" height="605" rx="16" fill="#f8fafc" stroke="#ccd9e4" stroke-width="1.6"/>
<text x="434" y="179" fill="#17324d" font-size="23" font-weight="700" text-anchor="start"><tspan x="434" dy="0">ipe-control · proposed policy service</tspan></text>
<rect x="440" y="208" width="530" height="140" rx="12" fill="#f1edfb" stroke="#9581bb" stroke-width="1.6"/>
<text x="462" y="244" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="462" dy="0">ExecutablePolicyRevision</tspan></text>
<text x="462" y="277" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"><tspan x="462" dy="0">Locally authored or explicitly translated</tspan><tspan x="462" dy="27">Immutable content + separate assignment</tspan></text>
<rect x="440" y="400" width="530" height="140" rx="12" fill="#eaf7f3" stroke="#58a38a" stroke-width="1.6"/>
<text x="462" y="436" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="462" dy="0">ExternalContractObservation</tspan></text>
<text x="462" y="469" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"><tspan x="462" dy="0">External enforcer + source revision</tspan><tspan x="462" dy="27">Observation validity + coverage + provenance</tspan></text>
<rect x="440" y="590" width="530" height="130" rx="12" fill="#eaf7f3" stroke="#58a38a" stroke-width="1.6"/>
<text x="462" y="626" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="462" dy="0">ExternalEvaluationObservation</tspan></text>
<text x="462" y="659" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"><tspan x="462" dy="0">Actor + operation + input + time</tspan><tspan x="462" dy="27">Reported result; bounded permitted reuse</tspan></text>
<rect x="42" y="208" width="290" height="140" rx="12" fill="#f1edfb" stroke="#9581bb" stroke-width="1.6"/>
<text x="64" y="244" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="64" dy="0">Policy author</tspan></text>
<text x="64" y="277" fill="#526b80" font-size="19.90" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Executable publication grant</tspan><tspan x="64" dy="27">Example: approval guard</tspan></text>
<rect x="42" y="425" width="290" height="210" rx="12" fill="#eaf7f3" stroke="#58a38a" stroke-width="1.6"/>
<text x="64" y="461" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="64" dy="0">ipe-integration</tspan></text>
<text x="64" y="494" fill="#526b80" font-size="19.30" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Brokered provider access</tspan><tspan x="64" dy="27">Discover contract constraints</tspan><tspan x="64" dy="27">Observe external evaluations</tspan><tspan x="64" dy="27">Publish permitted facts</tspan></text>
<rect x="42" y="732" width="290" height="110" rx="12" fill="#f3f6f8" stroke="#9dabb7" stroke-width="1.6"/>
<text x="64" y="768" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="64" dy="0">External system</tspan></text>
<text x="64" y="801" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Example: ServiceNow</tspan></text>
<rect x="1090" y="208" width="310" height="170" rx="12" fill="#f1edfb" stroke="#9581bb" stroke-width="1.6"/>
<text x="1112" y="244" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="1112" dy="0">ipe-server</tspan></text>
<text x="1112" y="277" fill="#526b80" font-size="18.33" font-weight="400" text-anchor="start"><tspan x="1112" dy="0">Fetch assigned executable policy</tspan><tspan x="1112" dy="27">Evaluate input.* + policy.*</tspan><tspan x="1112" dy="27">against expiring local data.*</tspan></text>
<rect x="1090" y="435" width="310" height="190" rx="12" fill="#edf4fb" stroke="#6c93b6" stroke-width="1.6"/>
<text x="1112" y="471" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="1112" dy="0">Admin UI and planning</tspan></text>
<text x="1112" y="504" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"><tspan x="1112" dy="0">Inspect external requirements</tspan><tspan x="1112" dy="27">Inspect contextual outcomes</tspan><tspan x="1112" dy="27">Show freshness and gaps</tspan><tspan x="1112" dy="27">No automatic local activation</tspan></text>
<rect x="440" y="826" width="530" height="115" rx="12" fill="#fff5e3" stroke="#c5a15d" stroke-width="1.6"/>
<text x="462" y="862" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="462" dy="0">FactSnapshot · separate fact path</tspan></text>
<text x="462" y="895" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"><tspan x="462" dy="0">Selected typed evidence with original validity</tspan><tspan x="462" dy="27">Example: approvals for one exact change</tspan></text>
<path d="M 332 274 H 440" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="386" y="245" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="386" dy="0">publish</tspan></text>
<path d="M 970 274 H 1090" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1030" y="230" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="1030" dy="0">assigned</tspan><tspan x="1030" dy="23">revision</tspan></text>
<path d="M 332 475 H 440" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="385" y="449" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="385" dy="0">publish</tspan></text>
<path d="M 332 595 H 379 V 651 H 440" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="382" y="685" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="382" dy="0">append</tspan></text>
<path d="M 970 463 H 1090" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1030" y="440" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="1030" dy="0">describe</tspan></text>
<path d="M 970 650 H 1045 V 590 H 1090" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1047" y="683" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="1047" dy="0">inspect</tspan></text>
<path d="M 187 732 V 635" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="195" y="682" fill="#526b80" font-size="18" font-weight="500" text-anchor="start"><tspan x="195" dy="0">observe</tspan></text>
<path d="M 332 615 H 354 V 883 H 440" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="365" y="789" fill="#526b80" font-size="18" font-weight="500" text-anchor="start"><tspan x="365" dy="0">publish</tspan><tspan x="365" dy="23">facts</tspan></text>
<path d="M 970 882 H 1030 V 355 H 1090" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1041" y="779" fill="#526b80" font-size="18" font-weight="500" text-anchor="start"><tspan x="1041" dy="0">load</tspan><tspan x="1041" dy="23">expiring</tspan><tspan x="1041" dy="23">data.*</tspan></text>
<text x="42" y="992" fill="#17324d" font-size="21" font-weight="550" text-anchor="start"><tspan x="42" dy="0">Publication into the central catalog does not imply assignment or activation at an enforcement endpoint.</tspan></text>
</g></svg>