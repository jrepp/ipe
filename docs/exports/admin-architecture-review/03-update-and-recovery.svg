<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">A managed endpoint refreshes policy approvals from r16 to r17</title><desc id="desc">Illustrative revision IDs: assignment generation g42; the endpoint records its own local catalog revision.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#71879a"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="1040" fill="white"/>
<text x="42" y="51" fill="#17324d" font-size="32" font-weight="700" text-anchor="start"><tspan x="42" dy="0">A managed endpoint refreshes policy approvals from r16 to r17</tspan></text>
<text x="42" y="86" fill="#526b80" font-size="19" font-weight="400" text-anchor="start"><tspan x="42" dy="0">Illustrative revision IDs: assignment generation g42; the endpoint records its own local catalog revision.</tspan></text>
<path d="M 42 110 H 1398" fill="none" stroke="#d6e1e9" stroke-width="2.4"/>
<rect x="60" y="144" width="300" height="83" rx="12" fill="#f1edfb" stroke="#9581bb" stroke-width="1.6"/>
<text x="82" y="180" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="82" dy="0">Policy publisher</tspan></text>
<text x="82" y="213" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"/>
<rect x="570" y="144" width="300" height="83" rx="12" fill="#edf4fb" stroke="#6c93b6" stroke-width="1.6"/>
<text x="592" y="180" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="592" dy="0">ipe-control</tspan></text>
<text x="592" y="213" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"/>
<rect x="1060" y="144" width="300" height="83" rx="12" fill="#f1edfb" stroke="#9581bb" stroke-width="1.6"/>
<text x="1082" y="180" fill="#17324d" font-size="23" font-weight="650" text-anchor="start"><tspan x="1082" dy="0">ipe-server · managed</tspan></text>
<text x="1082" y="213" fill="#526b80" font-size="20" font-weight="400" text-anchor="start"/>
<path d="M 210 227 V 938" fill="none" stroke="#b5c4cf" stroke-width="2.4" stroke-dasharray="7 6"/>
<path d="M 720 227 V 938" fill="none" stroke="#b5c4cf" stroke-width="2.4" stroke-dasharray="7 6"/>
<path d="M 1210 227 V 938" fill="none" stroke="#b5c4cf" stroke-width="2.4" stroke-dasharray="7 6"/>
<path d="M 210 280 H 720" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="465" y="266" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="465" dy="0">Assign executable policy approvals / r17</tspan></text>
<rect x="558" y="311" width="324" height="64" rx="12" fill="#edf4fb" stroke="#a7bfd3" stroke-width="1.6"/>
<text x="720" y="337" fill="#17324d" font-size="18" font-weight="500" text-anchor="middle"><tspan x="720" dy="0">Commit assignment g42</tspan><tspan x="720" dy="23">before emitting a hint</tspan></text>
<path d="M 720 416 H 1210" fill="none" stroke="#71879a" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="965" y="402" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="965" dy="0">Optional refresh hint — loss is safe</tspan></text>
<path d="M 1210 486 H 720" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="965" y="472" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="965" dy="0">Periodic pull of current authorized assignment</tspan></text>
<path d="M 720 556 H 1210" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="965" y="542" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="965" dy="0">g42 selects approvals / r17 and its digest</tspan></text>
<path d="M 1210 626 H 720" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="965" y="612" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="965" dy="0">Fetch the immutable r17 policy document</tspan></text>
<path d="M 720 696 H 1210" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="965" y="682" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="965" dy="0">Return the assigned policy content</tspan></text>
<rect x="1015" y="735" width="386" height="95" rx="12" fill="#f1edfb" stroke="#9581bb" stroke-width="1.6"/>
<text x="1208" y="762" fill="#17324d" font-size="18" font-weight="500" text-anchor="middle"><tspan x="1208" dy="0">Validate, install and activate</tspan><tspan x="1208" dy="25">Map central r17 → local revision 8</tspan><tspan x="1208" dy="25">Keep original source-validity checks</tspan></text>
<path d="M 1210 885 H 720" fill="none" stroke="#71879a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="965" y="871" fill="#526b80" font-size="18" font-weight="500" text-anchor="middle"><tspan x="965" dy="0">Report active: g42 / central r17 / local 8</tspan></text>
<text x="42" y="986" fill="#17324d" font-size="20" font-weight="550" text-anchor="start"><tspan x="42" dy="0">Next poll repairs a lost hint. No replay cursor is needed. Ordinary direct policy writes are rejected in managed scope.</tspan></text>
</g></svg>