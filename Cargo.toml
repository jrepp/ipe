[workspace]
members = [
    "crates/ipe-core",
    "crates/ipe-parser",
    "crates/ipe-control",
    "crates/ipe-wasm",
    "crates/ipe-ffi",
    "crates/ipe-web",
    "crates/ipe-server",
    "crates/ipe-integration",
    "crates/ipe-json",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["IPE Contributors"]
license = "MPL-2.0"
repository = "https://github.com/yourorg/ipe"

[workspace.dependencies]
# Core
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = ">=1.0.75"

# Performance
arc-swap = "1.6"
parking_lot = "0.12"

# WASM
wasm-bindgen = "0.2.88"
serde-wasm-bindgen = "0.6"
js-sys = "0.3.65"
web-sys = "0.3.65"

# Web
axum = { version = ">=0.7.4", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"

# Storage
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }

# Metrics
prometheus = "0.14"

# Tracing
tracing = ">=0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Regex (fix minimal versions - old regex versions have syntax module issues)
regex = "1.5.5"

# FFI
libc = "0.2"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
